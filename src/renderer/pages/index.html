<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scripter</title>
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/index2.css" />
  </head>
  <body>
    <div class="container">
      <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()"
          >&times;</a
        >
        <ul>
          <li><a href="index.html">Home</a></li>
          <li>
            <a href="#">Run Audit</a>
          </li>
          <li><a href="#">Setting</a></li>
          <li><a href="#">Reports</a></li>
        </ul>
      </div>

      <div class="main-content">
        <!-- Horizontal Navbar -->
        <nav class="horizontal-nav">
          <ul>
            <li>
              <button class="menu-button" onclick="openNav()">&#9776;</button>
            </li>
            <li><h1 class="main-heading">Automated Audit Script</h1></li>
            <li class="nav-right">
              <button class="scan-btn" onclick="redirectToPage()">
                FULL SCAN
              </button>
            </li>
          </ul>
        </nav>

        <!-- Page Content -->
        <div class="content">
          <form class="form">
            <h2>Configuration</h2>
            <div class="inputGroup">
              <input id="option1" name="option1" type="checkbox" />
              <label for="option1">Password Security Checks</label>
            </div>
            <div class="inputGroup">
              <input id="option2" name="option2" type="checkbox" />
              <label for="option2">Option Two</label>
            </div>
            <div class="inputGroup">
              <input id="option3" name="option3" type="checkbox" />
              <label for="option3">Option Three</label>
            </div>
            <div class="inputGroup">
              <input id="option4" name="option4" type="checkbox" />
              <label for="option4">Option Four</label>
            </div>
          </form>

          <div class="info-box" id="info-box">
            <!-- Info content will be dynamically added here -->
          </div>

          <link
            href="https://fonts.googleapis.com/css?family=Fira+Sans"
            rel="stylesheet"
          />
        </div>
        <div class="main">
          <button class="button" onclick="runScript()">Get Report</button>
          <pre id="reportTag" style="font-size:14px; margin-top:16px; white-space:pre-wrap;">Report will be generated after clicking on button</pre>

          <div class="loader">
            <div class="check">
              <span class="check-one"></span>
              <span class="check-two"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <img src="" alt="" />
    <script src="../scripts/script.js"></script>
    <script type="text/javascript">
      const scriptRunner = require("child_process");
      const path = require("path");

      const runScript = () => {
        console.log("Hello World!");
        const loaderEl = document.querySelector('.loader');
        const checkEl = document.querySelector('.check');
        const selectedOption2 = document.getElementById("option2")?.checked;
        const scriptName = selectedOption2 ? "compare2.ps1" : "compare.ps1";
        if (loaderEl) loaderEl.classList.add('active');
        if (checkEl) checkEl.classList.remove('active');
        document.getElementById("reportTag").textContent = selectedOption2 ? "Running protection audit..." : "Running audit...";
        const projectRoot = process.cwd();
        const psPath = path.join(projectRoot, "Scripts", scriptName);

        const command = `cmd.exe /c powershell -NoProfile -ExecutionPolicy Bypass -File "${psPath}"`;
        scriptRunner.exec(command, (error, stdout, stderr) => {
          console.log("Script is Running");
          if (error) {
            console.error(`Execution error: ${error}`);
            if (loaderEl) loaderEl.classList.remove('active');
            document.getElementById("reportTag").textContent = stderr || error.message || "Unable to generate report.";
            return;
          }
          document.getElementById("reportTag").textContent = stdout || stderr || "No report output returned.";
          if (loaderEl) loaderEl.classList.remove('active');
          if (checkEl) checkEl.classList.add('active');
        });
      };
      const option2Label = document.querySelector('label[for="option2"]');
      if (option2Label) {
        option2Label.textContent = "Protection Audit";
      }
    </script>
  </body>
</html>
